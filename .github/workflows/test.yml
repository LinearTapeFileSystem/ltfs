name: Test Suite

on: [push, pull_request]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fuse: [fuse3, fuse2]

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get -q update
          sudo apt-get -q -y install --no-install-recommends \
            build-essential automake autoconf libtool pkg-config \
            icu-devtools libicu-dev libxml2-dev uuid-dev libsnmp-dev \
            libfuse-dev libfuse3-dev attr

      - name: Build
        run: |
          ./autogen.sh
          ./configure ${{ matrix.fuse == 'fuse2' && '--with-fuse2' || '' }}
          make -j"$(nproc)"

      - name: Run tests
        run: make check VERBOSE=1
